<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#14140f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)" />
    <script>
      // both are set before first paint, so a shared or saved look never flashes
      const el = document.documentElement;
      // this key held light/dark before themes existed, so move an old one across
      const was = localStorage.getItem('statusquo-theme');
      if (was === 'light' || was === 'dark') {
        localStorage.setItem('statusquo-mode', was);
        localStorage.removeItem('statusquo-theme');
      }
      const mode = localStorage.getItem('statusquo-mode');
      if (mode) el.dataset.mode = mode;
      const theme =
        new URLSearchParams(location.search).get('theme') ??
        localStorage.getItem('statusquo-theme');
      if (theme) el.dataset.theme = theme;
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
